name: ci

on:
  push:
  pull_request:

jobs:
  windows-msys2:
    name: ${{ matrix.target }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - standalone
          - core-smoke
          - host-smoke
          - orchestrator-smoke
          - persistence-smoke
          - profile-smoke
          - provider-offline-smoke
          - stress-smoke
          - multi-agent-smoke
          - remote-worker-smoke
          - replay-smoke
          - examples

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            make

      - name: Standalone compile
        if: matrix.target == 'standalone'
        run: gcc -std=c11 -Wall -Wextra -pedantic -c xwork.c

      - name: Build core smoke
        if: matrix.target == 'core-smoke'
        run: gcc -std=c11 -Wall -Wextra -pedantic -Ilib/sqlite tests/xwork_core_smoke.c lib/sqlite/sqlite3.c -o tests/xwork_core_smoke.exe -lws2_32 -liphlpapi

      - name: Run core smoke
        if: matrix.target == 'core-smoke'
        run: ./tests/xwork_core_smoke.exe

      - name: Build host smoke
        if: matrix.target == 'host-smoke'
        run: gcc -std=c11 -Wall -Wextra -pedantic -Ilib/sqlite tests/xwork_host_smoke.c lib/sqlite/sqlite3.c -o tests/xwork_host_smoke.exe -lws2_32 -liphlpapi

      - name: Run host smoke
        if: matrix.target == 'host-smoke'
        run: ./tests/xwork_host_smoke.exe

      - name: Build orchestrator smoke
        if: matrix.target == 'orchestrator-smoke'
        run: gcc -std=c11 -Wall -Wextra -pedantic -Ilib/sqlite tests/xwork_orchestrator_smoke.c lib/sqlite/sqlite3.c -o tests/xwork_orchestrator_smoke.exe -lws2_32 -liphlpapi

      - name: Run orchestrator smoke
        if: matrix.target == 'orchestrator-smoke'
        run: ./tests/xwork_orchestrator_smoke.exe

      - name: Build persistence smoke
        if: matrix.target == 'persistence-smoke'
        run: gcc -std=c11 -Wall -Wextra -pedantic -Ilib/sqlite tests/xwork_persistence_smoke.c lib/sqlite/sqlite3.c -o tests/xwork_persistence_smoke.exe -lws2_32 -liphlpapi

      - name: Run persistence smoke
        if: matrix.target == 'persistence-smoke'
        run: ./tests/xwork_persistence_smoke.exe

      - name: Build profile smoke
        if: matrix.target == 'profile-smoke'
        run: gcc -std=c11 -Wall -Wextra -pedantic -Ilib/sqlite tests/xwork_profile_smoke.c lib/sqlite/sqlite3.c -o tests/xwork_profile_smoke.exe -lws2_32 -liphlpapi

      - name: Run profile smoke
        if: matrix.target == 'profile-smoke'
        run: ./tests/xwork_profile_smoke.exe

      - name: Build provider offline smoke
        if: matrix.target == 'provider-offline-smoke'
        run: gcc -std=c11 -Wall -Wextra -pedantic -Ilib/sqlite tests/xwork_orchestrator_provider_smoke.c lib/sqlite/sqlite3.c -o tests/xwork_orchestrator_provider_smoke.exe -lws2_32 -liphlpapi

      - name: Run provider offline smoke
        if: matrix.target == 'provider-offline-smoke'
        run: ./tests/xwork_orchestrator_provider_smoke.exe

      - name: Build stress smoke
        if: matrix.target == 'stress-smoke'
        run: gcc -std=c11 -Wall -Wextra -pedantic -Ilib/sqlite tests/xwork_stress_smoke.c lib/sqlite/sqlite3.c -o tests/xwork_stress_smoke.exe -lws2_32 -liphlpapi

      - name: Run stress smoke
        if: matrix.target == 'stress-smoke'
        run: ./tests/xwork_stress_smoke.exe

      - name: Build multi-agent smoke
        if: matrix.target == 'multi-agent-smoke'
        run: gcc -std=c11 -Wall -Wextra -pedantic -Ilib/sqlite tests/xwork_multi_agent_smoke.c lib/sqlite/sqlite3.c -o tests/xwork_multi_agent_smoke.exe -lws2_32 -liphlpapi

      - name: Run multi-agent smoke
        if: matrix.target == 'multi-agent-smoke'
        run: ./tests/xwork_multi_agent_smoke.exe

      - name: Build remote worker smoke
        if: matrix.target == 'remote-worker-smoke'
        run: gcc -std=c11 -Wall -Wextra -pedantic -Ilib/sqlite tests/xwork_remote_worker_smoke.c lib/sqlite/sqlite3.c -o tests/xwork_remote_worker_smoke.exe -lws2_32 -liphlpapi

      - name: Run remote worker smoke
        if: matrix.target == 'remote-worker-smoke'
        run: ./tests/xwork_remote_worker_smoke.exe

      - name: Build replay smoke
        if: matrix.target == 'replay-smoke'
        run: gcc -std=c11 -Wall -Wextra -pedantic -Ilib/sqlite tests/xwork_replay_smoke.c lib/sqlite/sqlite3.c -o tests/xwork_replay_smoke.exe -lws2_32 -liphlpapi

      - name: Run replay smoke
        if: matrix.target == 'replay-smoke'
        run: ./tests/xwork_replay_smoke.exe

      - name: Build examples
        if: matrix.target == 'examples'
        run: |
          gcc -std=c11 -Wall -Wextra -pedantic -I. -Ilib/sqlite examples/ai_ide_agent.c examples/xwork_example_runtime.c lib/sqlite/sqlite3.c -o examples/ai_ide_agent.exe -lws2_32 -liphlpapi
          gcc -std=c11 -Wall -Wextra -pedantic -I. -Ilib/sqlite examples/claw_autonomous_agent.c examples/xwork_example_runtime.c lib/sqlite/sqlite3.c -o examples/claw_autonomous_agent.exe -lws2_32 -liphlpapi
          gcc -std=c11 -Wall -Wextra -pedantic -I. -Ilib/sqlite examples/multi_agent_claw.c examples/xwork_example_runtime.c lib/sqlite/sqlite3.c -o examples/multi_agent_claw.exe -lws2_32 -liphlpapi
          gcc -std=c11 -Wall -Wextra -pedantic -I. -Ilib/sqlite examples/remote_worker_agent.c examples/xwork_example_runtime.c lib/sqlite/sqlite3.c -o examples/remote_worker_agent.exe -lws2_32 -liphlpapi
          gcc -std=c11 -Wall -Wextra -pedantic -I. -Ilib/sqlite examples/replay_agent_run.c examples/xwork_example_runtime.c lib/sqlite/sqlite3.c -o examples/replay_agent_run.exe -lws2_32 -liphlpapi

      - name: Run examples
        if: matrix.target == 'examples'
        run: |
          ./examples/ai_ide_agent.exe
          ./examples/claw_autonomous_agent.exe
          ./examples/multi_agent_claw.exe
          ./examples/remote_worker_agent.exe
          ./examples/replay_agent_run.exe

  provider-real-smoke:
    name: provider-real-smoke
    runs-on: windows-latest
    continue-on-error: true
    if: ${{ vars.XWORK_RUN_REAL_PROVIDER_SMOKE == '1' }}

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Build provider smoke
        run: gcc -std=c11 -Wall -Wextra -pedantic -Ilib/sqlite tests/xwork_orchestrator_provider_smoke.c lib/sqlite/sqlite3.c -o tests/xwork_orchestrator_provider_smoke.exe -lws2_32 -liphlpapi

      - name: Run provider real smoke
        env:
          XWORK_PROVIDER_SMOKE_ADAPTER: ${{ vars.XWORK_PROVIDER_SMOKE_ADAPTER }}
          XWORK_PROVIDER_SMOKE_BASE_URL: ${{ vars.XWORK_PROVIDER_SMOKE_BASE_URL }}
          XWORK_PROVIDER_SMOKE_MODEL: ${{ vars.XWORK_PROVIDER_SMOKE_MODEL }}
          XWORK_PROVIDER_SMOKE_API_KEY: ${{ secrets.XWORK_PROVIDER_SMOKE_API_KEY }}
          XWORK_PROVIDER_SMOKE_PROFILE_ID: ${{ vars.XWORK_PROVIDER_SMOKE_PROFILE_ID }}
          XWORK_PROVIDER_SMOKE_XWORK_PROFILE: ${{ vars.XWORK_PROVIDER_SMOKE_XWORK_PROFILE }}
          XWORK_PROVIDER_SMOKE_PROVIDER: ${{ vars.XWORK_PROVIDER_SMOKE_PROVIDER }}
          XWORK_PROVIDER_SMOKE_OPENAI_ORG_ID: ${{ vars.XWORK_PROVIDER_SMOKE_OPENAI_ORG_ID }}
          XWORK_PROVIDER_SMOKE_OPENAI_PROJECT_ID: ${{ vars.XWORK_PROVIDER_SMOKE_OPENAI_PROJECT_ID }}
          XWORK_PROVIDER_SMOKE_ANTHROPIC_API_VERSION: ${{ vars.XWORK_PROVIDER_SMOKE_ANTHROPIC_API_VERSION }}
          XWORK_PROVIDER_SMOKE_ANTHROPIC_BETA_HEADERS: ${{ vars.XWORK_PROVIDER_SMOKE_ANTHROPIC_BETA_HEADERS }}
          XWORK_PROVIDER_SMOKE_DEBUG_MODE: ${{ vars.XWORK_PROVIDER_SMOKE_DEBUG_MODE }}
          XWORK_PROVIDER_SMOKE_REDACT_MODE: ${{ vars.XWORK_PROVIDER_SMOKE_REDACT_MODE }}
          XWORK_PROVIDER_SMOKE_CONNECT_TIMEOUT_MS: ${{ vars.XWORK_PROVIDER_SMOKE_CONNECT_TIMEOUT_MS }}
          XWORK_PROVIDER_SMOKE_READ_TIMEOUT_MS: ${{ vars.XWORK_PROVIDER_SMOKE_READ_TIMEOUT_MS }}
          XWORK_PROVIDER_SMOKE_VERIFY_PEER: ${{ vars.XWORK_PROVIDER_SMOKE_VERIFY_PEER }}
          XWORK_PROVIDER_SMOKE_PROXY_KIND: ${{ vars.XWORK_PROVIDER_SMOKE_PROXY_KIND }}
          XWORK_PROVIDER_SMOKE_PROXY_HOST: ${{ vars.XWORK_PROVIDER_SMOKE_PROXY_HOST }}
          XWORK_PROVIDER_SMOKE_PROXY_PORT: ${{ vars.XWORK_PROVIDER_SMOKE_PROXY_PORT }}
          XWORK_PROVIDER_SMOKE_PROXY_USER: ${{ vars.XWORK_PROVIDER_SMOKE_PROXY_USER }}
          XWORK_PROVIDER_SMOKE_PROXY_PASS: ${{ secrets.XWORK_PROVIDER_SMOKE_PROXY_PASS }}
          XWORK_PROVIDER_SMOKE_CA_BUNDLE_PATH: ${{ vars.XWORK_PROVIDER_SMOKE_CA_BUNDLE_PATH }}
          XWORK_PROVIDER_SMOKE_CLIENT_CERT_PATH: ${{ vars.XWORK_PROVIDER_SMOKE_CLIENT_CERT_PATH }}
          XWORK_PROVIDER_SMOKE_CLIENT_KEY_PATH: ${{ vars.XWORK_PROVIDER_SMOKE_CLIENT_KEY_PATH }}
          XWORK_PROVIDER_SMOKE_EXPECT_ERROR: ${{ vars.XWORK_PROVIDER_SMOKE_EXPECT_ERROR }}
        run: ./tests/xwork_orchestrator_provider_smoke.exe
